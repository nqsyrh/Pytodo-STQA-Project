[pytest]
testpaths =
    01_Black_Box
    02_White_Box_Coverage
    04_Web_API
    05_Security_Performance
    06_Automation_Regression
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: white-box unit tests on helpers.py (no server)
    blackbox: black-box tests through the HTML forms (Flask test client)
    api: REST API tests (Flask test client)
    security: STRIDE-derived security tests (local copy only)
    ui: Selenium end-to-end tests (needs the app running at BASE_URL)
    smoke: minimal compatibility smoke set (subset of ui)
    regression: focused regression suite (52 tests)
    defect: known defect this test confirms when it fails
filterwarnings =
    ignore::DeprecationWarning
